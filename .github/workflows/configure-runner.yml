name: Create Selfhosted Runner
on:
  workflow_dispatch:
    inputs:
      RUNNER_TOKEN:
        description: 'Runner registration token'
        required: true

jobs:
  run-devspace-and-tmux:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y tmux jq

    - name: Configure Crave binary and credentials
      env:
        CRAVE_USER_SECRET: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_AUTH_SECRET: ${{ secrets.CRAVE_TOKEN }}
      run: |
        if [[ $DCDEVSPACE == *1* ]]; then
          echo 'No need to set up crave, we are already running in devspace!'
        else
          mkdir -p ${HOME}/bin ${HOME}/.crave
          cp ${PWD}/bin/crave ${HOME}/bin/crave
          chmod +x ${HOME}/bin/crave
          sudo ln -sf ${HOME}/bin/crave /usr/bin/crave

          CRAVE_USER="$CRAVE_USER_SECRET"
          if [[ -z "$CRAVE_USER" || "$CRAVE_USER" != *"@"* ]]; then
            CRAVE_USER="iamshaikhazmathulla@gmail.com"
          fi
          CRAVE_AUTH="$CRAVE_AUTH_SECRET"
          if [[ -z "$CRAVE_AUTH" || "$CRAVE_AUTH" != *"eyJ"* ]]; then
            CRAVE_AUTH="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjI3MiwidGVhbUlkIjoxNCwiaXNBcGlLZXkiOnRydWUsImlhdCI6MTc5NDIwMzkxMH0.WLw9yN_GWdlNiTdHEygKCqmzqQvnr6Tuvkt9gQPtP-E"
          fi

          export CRAVE_USER CRAVE_AUTH
          python3 -c "import json, os; conf = {'username': os.environ['CRAVE_USER'], 'headers': {'Content-Type': 'application/json', 'Authorization': os.environ['CRAVE_AUTH'], 'User-Agent': 'Crave'}, 'projects': [], 'server': 'https://foss.crave.io/api'}; open(os.path.expanduser('~/.crave/crave.conf'), 'w').write(json.dumps(conf, indent=2))"
          cp ${HOME}/.crave/crave.conf ${PWD}/crave.conf
          cp ${HOME}/.crave/crave.conf ${HOME}/crave.conf
          echo "Crave configuration created for user:"
          jq -r '.username' ${HOME}/.crave/crave.conf
        fi

    - name: Run crave devspace
      run: |
        crave -v -c ${HOME}/crave.conf devspace --no-pty -- "bash -c '
          set -e
          echo \"=== Setting up GitHub Actions Runner in Devspace ===\"
          RUNNER_DIR=\"/crave-devspaces/actions-runner\"
          if [ ! -d \"\$RUNNER_DIR\" ]; then
            RUNNER_DIR=\"actions-runner\"
          fi
          mkdir -p \"\$RUNNER_DIR\"
          cd \"\$RUNNER_DIR\"

          if [ ! -f ./config.sh ]; then
            echo \"Downloading runner package v2.321.0...\"
            curl -o actions-runner-linux-x64-2.321.0.tar.gz -L https://github.com/actions/runner/releases/download/v2.321.0/actions-runner-linux-x64-2.321.0.tar.gz
            tar xzf actions-runner-linux-x64-2.321.0.tar.gz
            rm -f actions-runner-linux-x64-2.321.0.tar.gz
          fi

          echo \"Cleaning previous configuration...\"
          tmux kill-session -t ghactions 2>/dev/null || true
          rm -f .runner .credentials .credentials_rsaparams || true

          echo \"Configuring runner for ${{ github.repository }}...\"
          ./config.sh --unattended --url \"https://github.com/${{ github.repository }}\" --token \"${{ inputs.RUNNER_TOKEN }}\" --name \"crave-runner-sweetbenz\" --replace

          echo \"Starting runner in tmux session...\"
          tmux new-session -d -s ghactions \"./run.sh\"
          sleep 3
          tmux ls
          echo \"Runner successfully configured and started!\"
        '"
